<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Monthly digest</title>
<style>
  body { margin: 0; padding: 0; background-color: #f4f4f4; }
  .wrapper { width: 100%; table-layout: fixed; }
  .container { max-width: 600px; margin: 0 auto; }
  .button {
    background-color: #2b6cb0;
    border-radius: 6px;
    color: #ffffff;
    display: inline-block;
    padding: 12px 24px;
    text-decoration: none;
  }
  @media screen and (max-width: 600px) {
    .container { width: 100% !important; }
    .stack { display: block !important; width: 100% !important; }
  }
</style>
<!--[if mso]>
<style>.button { padding: 0 !important; }</style>
<![endif]-->
</head>
<body>
<center class="wrapper">
<table class="container" role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" align="center">
  <tr>
    <td align="center" bgcolor="#ffffff" style="padding: 24px">
      <img src="https://example.com/logo.png" width="160" height="40" alt="Logo" style="display:block">
    </td>
  </tr>
  <tr>
    <td style="padding: 0 24px 24px; font-family: Helvetica, Arial, sans-serif; font-size: 16px; line-height: 1.5">
      <h1 style="font-size: 24px; margin: 0 0 12px">This month</h1>
      <p style="margin: 0 0 16px">A short paragraph with a <a href="https://example.com/post">link</a>.</p>
      <a href="https://example.com/cta" class="button">Read more</a>
    </td>
  </tr>
  <tr>
    <td align="center" style="padding: 16px; color: #888888; font-size: 12px">
      <a href="mailto:unsubscribe@example.com">Unsubscribe</a>
    </td>
  </tr>
</table>
</center>
</body>
</html>
