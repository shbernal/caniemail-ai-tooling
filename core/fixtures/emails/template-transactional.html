<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<title>Your receipt</title>

<body style="margin:0; padding:0; background:#ffffff">
<table width="100%" cellpadding="0" cellspacing="0" border="0">
  <tr>
    <td align="center" valign="top">
      <table width="560" cellpadding="0" cellspacing="0" border="0" style="border:1px solid #dddddd">
        <tr>
          <td style="padding:20px; font-family:Arial, sans-serif; font-size:14px; color:#333333">
            <p style="margin:0 0 12px">Thanks for your order.</p>
            <table width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td style="border-bottom:1px solid #eeeeee; padding:8px 0">Widget</td>
                <td align="right" style="border-bottom:1px solid #eeeeee; padding:8px 0">$19.00</td>
              </tr>
              <tr>
                <td style="padding:8px 0; font-weight:bold">Total</td>
                <td align="right" style="padding:8px 0; font-weight:bold">$19.00</td>
              </tr>
            </table>
            <p style="margin:16px 0 0">
              <a href="https://example.com/receipt" style="color:#2b6cb0; text-decoration:underline">View receipt</a>
            </p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
