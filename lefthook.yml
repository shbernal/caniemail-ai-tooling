# Local git hooks. Install them once per clone with:
#
#     pnpm install && pnpm exec lefthook install
#
# (`pnpm install` alone usually suffices — lefthook's postinstall syncs the
# hooks — but it is allowed to run that script only because pnpm-workspace.yaml
# lists it under `allowBuilds`, so the explicit command stays documented.)
#
# Commit-message rules shared across every repo here, so the regex has one
# definition rather than one copy per project. Lefthook fetches this on `install`
# and caches it under .git/info/lefthook-remotes/; refetch_frequency is what lets
# a fix in the shared repo ever arrive. The tag is pinned on purpose — a branch
# would mean any push there changes what this repo runs.
#
# Jobs merge rather than override, so adding a local commit-msg job later does
# not displace this one.
remotes:
  - git_url: https://github.com/shbernal/lefthook-rules
    ref: v1
    configs:
      - rules/no-ai-attribution.yml
    refetch_frequency: 24h

# These are deliberately the same gates CI runs. The vendoring rule is the one
# invariant a commit can quietly break — core/ and its copies under
# skill/scripts and mcp/src must stay byte-identical — and until now nothing
# enforced it except remembering to run `make sync-core`. Both commands are
# fast (a few seconds together; the suite runs its files in parallel) and
# read-only, so they always run rather than being scoped to changed paths: a
# doc-only commit that happens to carry a stale vendored file should still fail.
pre-commit:
  parallel: true
  commands:
    check-vendor:
      run: make check-vendor
      fail_text: vendored copies drifted from core/ — run `make sync-core`
    test:
      run: make test
      fail_text: core suite failed
