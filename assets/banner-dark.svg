  <title id="title">caniemail-ai-tooling</title>
  <desc id="desc">Email client compatibility for AI agents. A grid of email clients, each cell coloured by verdict: supported, unsupported, mitigated or untested.</desc>
  <style>
    .c{animation-duration:9s;animation-timing-function:ease-in-out;animation-iteration-count:infinite}
    @keyframes r-vs{0%,100%{fill:#3fb950}2.5%{fill:#30363d}9%{fill:#3fb950}}
    .vs{fill:#3fb950;animation-name:r-vs}
    @keyframes r-vx{0%,100%{fill:#f85149}2.5%{fill:#30363d}9%{fill:#f85149}}
    .vx{fill:#f85149;animation-name:r-vx}
    @keyframes r-vm{0%,100%{fill:#d29922}2.5%{fill:#30363d}9%{fill:#d29922}}
    .vm{fill:#d29922;animation-name:r-vm}
    @keyframes r-vt{0%,100%{fill:#8b949e}2.5%{fill:#30363d}9%{fill:#8b949e}}
    .vt{fill:#8b949e;animation-name:r-vt}
    @keyframes sweep{
      0%{opacity:0;transform:translateX(0)}
      3%{opacity:1;transform:translateX(0)}
      36%{opacity:1;transform:translateX(418px)}
      40%,100%{opacity:0;transform:translateX(418px)}
    }
    .bar{opacity:0;animation:sweep 9s linear infinite}
    @media (prefers-reduced-motion: reduce){.c,.bar{animation:none}}
  </style>
