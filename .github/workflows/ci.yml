name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The network test is deliberately absent: it hits www.caniemail.com, so a
# caniemail.com outage must not read as a broken commit. Everything here runs
# offline against core/data/caniemail.json.
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v5

      # Must precede setup-node: `cache: pnpm` needs the binary to already
      # exist. The version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # One install covers both package trees — the root's devDependencies and
      # mcp/'s runtime deps. The shipped core has none of its own; `caniemail`
      # is here for the differential suite and nothing else.
      - run: pnpm install --frozen-lockfile

      # The vendored copies under skill/scripts and mcp/src must stay
      # byte-identical to core/. This is the gate that catches a core edit
      # committed without `make sync-core`.
      - name: Check vendored copies match the core
        run: make check-vendor

      # Includes the differential suite, which also pins detection output
      # against core/fixtures/expected.
      - name: Run the core suite
        run: make test

      # Covers the transport and tool registrations, which the core suite
      # does not reach. mcp/node_modules came from the workspace install above.
      - name: Drive the MCP server over stdio
        run: make smoke
